name: Heartbeat

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    name: Observer heartbeat (Phase 1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run heartbeat (observer-only)
        run: npm run heartbeat:run

      - name: Upload heartbeat reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heartbeat-${{ github.run_id }}
          path: generated/heartbeat/
          retention-days: 30
